name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y python3-pil fonts-noto-core fonts-dejavu-core ffmpeg
      - run: npm test
      - run: npm run test:e2e
      - run: npm run render:local -- examples/ravaj-intro.json /tmp/ravaj.mp4
      - run: ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/ravaj.mp4
      - run: docker build -t chat-video-studio:ci .
