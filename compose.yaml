# Any Docker Compose capable VPS can run this. No Railway or external database.
services:
  studio:
    build: .
    restart: unless-stopped
    environment:
      PORT: '8787'
      HOST: 0.0.0.0
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      STUDIO_TOKEN: ${STUDIO_TOKEN:?Set STUDIO_TOKEN in .env}
      MCP_ACCESS_PATH: ${MCP_ACCESS_PATH:?Set MCP_ACCESS_PATH in .env}
      MAX_PROJECTS: ${MAX_PROJECTS:-200}
      MAX_OUTPUT_MB: ${MAX_OUTPUT_MB:-2048}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    volumes:
      - studio_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ['CMD','node','-e','fetch("http://127.0.0.1:8787/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - private
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      studio:
        condition: service_healthy
    networks:
      - private
networks:
  private:
volumes:
  studio_data:
  caddy_data:
  caddy_config:
