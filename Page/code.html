<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Effect</title>
    <link rel="stylesheet" href="code-style.css">
    <link rel="stylesheet" href="../Hed_Style/header-style.css">
    <link rel="stylesheet" href="../Form/form-style.css">
</head>

<body>
    <div id="overlay"></div>
    <div class="contianer" >
        <nav class="hed" style="height: 70px;">

            <div class="f-1">
                <img src="../image/search.png" alt="">
                <input autocomplete="off" placeholder="Search Animation..." type="search" value="">
            </div>

            <div class="f-2">
                <p id="animation-name">Animation</p>
            </div>
            <div class="f-3">
                <button id="btn-sin" onclick="openForm('signup')">Sign Up</button>
                <button id="btn-log" onclick="openForm('login')">Log In</button>
            </div>
        </nav>

        <div class="form-container" id="form">
            <div class="form">
                <span class="form-close" onclick="closeForm()">×</span>
                <h2 id="form-title">Sign Up</h2>
                <form>
                    <label for="email">Email</label>
                    <input type="email" placeholder="Enter your email" required>

                    <label for="password">Password</label>
                    <input type="password" placeholder="Enter your password" required>

                    <button type="submit" id="form-button">Submit</button>
                </form>
            </div>
        </div>
        <div class="code-box">
            <div class="html">
                <nav id="hed">
                    <div>
                        <img src="../image/html.png" id="html-icon">
                        <p>HTML</p>
                    </div>
                </nav>
                <pre id="html-code">

                </pre>
            </div>
            <div class="css">
                <nav id="hed">
                    <div>
                        <img src="../image/css.png" id="html-icon">
                        <p>CSS</p>
                    </div>
                </nav>
                <pre id="css-code">

                </pre>
            </div>
        </div>

        <div class="line"></div>

        <div id="res" class="res"></div>

        <script src="../script/form_script.js"></script>
        <script src="../script/load.js"></script>
    </div>
</body>

</html>
