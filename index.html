<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Effect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Hed_Style/header-style.css">
    <link rel="stylesheet" href="Hed_Style/sidebar-style.css">
    <link rel="stylesheet" href="Form/form-style.css">
    <link rel="stylesheet" href="Animation/rotate.css">
    <link rel="stylesheet" href="Animation/swipe.css">
    <link rel="stylesheet" href="Animation/hover.css">
    <link rel="stylesheet" href="Animation/glowing.css">
    <link rel="stylesheet" href="Animation/stretching.css">
    <link rel="stylesheet" href="Animation/swipe-top.css">
    <link rel="stylesheet" href="Animation/text-scaling.css">
    <link rel="stylesheet" href="Animation/layer.css">
    <link rel="stylesheet" href="Animation/layer-swipe.css">
    <link rel="stylesheet" href="Animation/splited.css">
    <link rel="stylesheet" href="Animation/circular-swapping.css">
    <link rel="stylesheet" href="Animation/two-layers-swapping.css">
</head>

<body>
    <div id="overlay"></div>

    <div class="hed">
        <nav>
            <div class="f-1">
                <img src="image/search.png" alt="">
                <input autocomplete="off" placeholder="Search Animation..." type="search" value="">
            </div>
            <div class="f-3">
                <button id="btn-sin" onclick="openForm('signup')">Sign Up</button>
                <button id="btn-log" onclick="openForm('login')">Log In</button>
            </div>
        </nav>
        <div class="left">
            <h1 class="title">Button Animation</h1>
        </div>
    </div>

    <div class="form-container" id="form">
        <div class="form">
            <span class="form-close" onclick="closeForm()">×</span>
            <h2 id="form-title">Sign Up</h2>
            <form>
                <label for="email">Email</label>
                <input type="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" placeholder="Enter your password" required>

                <button type="submit" id="form-button">Submit</button>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="per">
            <p id="rotate">Rotate</p>
            <div>
                <button onclick="open_animation(rotate)" id="btn-1">
                    <p>Test</p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Swipe">Swipe</p>
            <div>
                <button onclick="open_animation(Swipe)" id="btn-2">
                    <p>Test</p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Hover">Hover</p>
            <div>
                <button onclick="open_animation(Hover)" id="btn-3">
                    <p>Test</p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Stretching">Stretching</p>
            <div>
                <button onclick="open_animation(Stretching)" id="btn-4">
                    <p>Test</p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Swipe_Top">Swipe - Top</p>
            <div>
                <button onclick="open_animation(Swipe_Top)" id="btn-5">
                    <p>Test</p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Glowing">Glowing</p>
            <div>
                <button onclick="open_animation(Glowing)" id="btn-6">
                    <p>Test</p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Two_Layers">Two - Layers</p>
            <div>
                <button onclick="open_animation(Two_Layers)" id="btn-7">
                    <p></p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Text_Scaling">Text - Scaling</p>
            <div>
                <button onclick="open_animation(Text_Scaling)" id="btn-8">
                    <p>Test</p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Circular_Swapping">Circular-Swapping</p>
            <div>
                <button onclick="open_animation(Circular_Swapping)" id="btn-9">
                    <p>Test</p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Layer">Layer</p>
            <div>
                <button onclick="open_animation(Layer)" id="btn-10">
                    <p>Test</p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Layer_Swipe">Layer - Swipe</p>
            <div>
                <button onclick="open_animation(Layer_Swipe)" id="btn-11">
                    <p></p>
                </button>
            </div>
        </div>
        <div class="per">
            <p id="Splited">Splited</p>
            <div>
                <button onclick="open_animation(Splited)" id="btn-12">
                    <p>Test</p>
                </button>
            </div>
        </div>
    </div>

    <script src="script/form_script.js"></script>
    <script src="script/open-page.js"></script>

</body>

</html>
